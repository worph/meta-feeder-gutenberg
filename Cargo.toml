[workspace]
resolver = "2"
members = ["feeder-plugin/*"]
# The vendored SDK copy is no longer built: book-feeder pins meta-feeder-sdk by
# git tag. Excluded (not deleted) so a stray `cargo` run inside it does not try
# to join this workspace.
exclude = ["crates/meta-feeder-sdk"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/worph/meta-feeder-book"
