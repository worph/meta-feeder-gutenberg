[package]
name = "book-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Book feeder sidecar, two upstreams:
# - `gutenberg` — Project Gutenberg editions (via Gutendex), the byte tier.
# - `openlibrary` — Open Library work cards, the book identity tier
#   (`TMDB : video :: AniList : comics :: Open Library : books`).

[lib]
name = "book_feeder"
path = "src/lib.rs"

[[bin]]
name = "book-feeder"
path = "src/main.rs"

[dependencies]
# Pinned by TAG, never by path. A path dep resolves OUTSIDE the crate, and the
# vendored copy this used to point at had already drifted behind the shared SDK
# (no `RateBudget`, a capped card cid). The rest of the fleet pins the same
# way; see meta-feeder-anilist's manifest.
meta-feeder-sdk = { git = "https://github.com/worph/meta-feeder-sdk", tag = "v1.2.1" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
base64 = "0.22"
tokio = { version = "1.40", features = ["full", "test-util"] }
